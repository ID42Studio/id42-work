site_name: ID42 Work SDK
site_description: Define work. Govern execution. Verify outcomes.
# The site is not published yet. These point at the repository until then.
site_url: https://github.com/ID42Studio/id42-work/tree/main/docs
repo_url: https://github.com/ID42Studio/id42-work
repo_name: ID42Studio/id42-work
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Work: concepts/work.md
      - Policy: concepts/policy.md
      - Execution: concepts/execution.md
      - Approval: concepts/approval.md
      - Outcome and evidence: concepts/outcome.md
      - Journal and replay: concepts/journal.md
      - Reconciliation: concepts/reconciliation.md
  - AI agents: agents.md
  - MCP server: mcp.md
  - Operator UI: web.md
  - Storage: storage.md
  - Architecture: architecture.md
  - Security: security.md
  - Roadmap: roadmap.md
  - Releasing: releasing.md
