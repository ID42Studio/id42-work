[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "id42-work"
version = "0.1.0rc2"
description = "Define work. Govern execution. Verify outcomes. A lightweight SDK for governed execution of work by software systems and AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ID42 Studio", email = "talkid42studio@gmail.com" }]
maintainers = [{ name = "ID42 Studio", email = "talkid42studio@gmail.com" }]
keywords = ["ai-agents", "governance", "human-in-the-loop", "approval", "idempotency", "workflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
pydantic-ai = ["pydantic-ai-slim>=2.73,<3"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
id42-work = "id42_work.cli:main"

[project.urls]
Homepage = "https://github.com/ID42Studio/id42-work"
Repository = "https://github.com/ID42Studio/id42-work"
Documentation = "https://github.com/ID42Studio/id42-work/tree/main/docs"
Changelog = "https://github.com/ID42Studio/id42-work/blob/main/CHANGELOG.md"
Issues = "https://github.com/ID42Studio/id42-work/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/id42_work"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", "SPEC.md", "SECURITY.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["postgres: requires ID42_POSTGRES_DSN and the postgres extra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["id42_work"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["SPEC.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "TID", "ANN", "S", "BLE", "RET", "PL",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
"examples/**" = ["T201", "S101", "PLR2004"]
"src/id42_work/testing/contract.py" = ["S101", "ANN401", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["tests", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"
