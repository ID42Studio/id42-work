name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev --locked
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=100

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv run --with mkdocs-material mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import id42_work; print(id42_work.__version__)"
          /tmp/wheel-env/bin/python examples/hello_work.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
