name: Publish

# Publishes with trusted publishing (OIDC). The repository stores no tokens.
# Pushing a version tag such as v0.1.0rc2 publishes to PyPI.
# A manual run publishes only to TestPyPI.

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      target:
        description: "Registry. Only TestPyPI is accepted."
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Manual runs publish only to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'testpypi'
        run: |
          echo "A manual run can only publish to TestPyPI."
          exit 1

      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
      - run: uv sync --all-extras --dev --locked
      - run: uv run pytest
      - name: Check that the release tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/id42-work
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/id42-work
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
